name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "apps/**"
      - "db/**"
      - "generated/**"
      - "packages/**"
      - "scripts/**"
      - "source/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Internal build version written into the SQLite release_info table, for example v0.1.0 (the GitHub release tag is always 'download')"
        required: false
        type: string

permissions:
  contents: write

# A single fixed "download" rolling release is overwritten on every publish,
# so all release runs must serialize against the same group to avoid clobbering
# the asset mid-write.
concurrency:
  group: release-download
  cancel-in-progress: false

jobs:
  release:
    name: Build SQLite Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate data
        run: |
          pnpm generate
          pnpm check

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="v0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Release version must look like v0.1.0; got $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build SQLite database
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm release:sqlite

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeatlas-sqlite-${{ steps.version.outputs.version }}
          path: release/animeatlas.sqlite

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="download"
          file="release/animeatlas.sqlite"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/animeatlas.sqlite"
          notes="Always-up-to-date AnimeAtlas offline SQLite database. This is a rolling release: the asset below is overwritten on every publish, so the download URL never changes: ${asset_url}  The exact build is recorded inside the file in the release_info table (SELECT value FROM release_info WHERE key = 'version')."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Download" --notes "$notes"
          else
            gh release create "$tag" "$file" \
              --target "$GITHUB_SHA" \
              --title "Download" \
              --notes "$notes"
          fi
