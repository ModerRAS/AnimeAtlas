name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "apps/**"
      - "assets/**"
      - "db/**"
      - "generated/**"
      - "packages/**"
      - "scripts/**"
      - "source/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version embedded in SQLite and used for the immutable release, for example v2.0.0"
        required: false
        type: string

permissions:
  contents: write

# Immutable semantic-version releases and the rolling download alias share the
# same build output, so release runs are serialized to avoid publishing mixed assets.
concurrency:
  group: release-download
  cancel-in-progress: false

jobs:
  release:
    name: Build SQLite Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate data
        run: |
          pnpm generate
          pnpm check

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="v0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Release version must look like v0.1.0; got $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build SQLite database
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm release:sqlite

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeatlas-sqlite-${{ steps.version.outputs.version }}
          path: |
            release/animeatlas.sqlite
            release/animeatlas-${{ steps.version.outputs.version }}.sqlite
            release/manifest.json
            release/animeatlas-${{ steps.version.outputs.version }}.manifest.json

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Immutable release $VERSION already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$VERSION" \
            "release/animeatlas-${VERSION}.sqlite" \
            "release/animeatlas-${VERSION}.manifest.json" \
            --target "$GITHUB_SHA" \
            --title "AnimeAtlas ${VERSION}" \
            --notes "Immutable AnimeAtlas SQLite ${VERSION}. Verify the database against the attached SHA-256 manifest."

      - name: Publish stable download alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="download"
          file="release/animeatlas.sqlite"
          manifest="release/manifest.json"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/animeatlas.sqlite"
          notes="Stable AnimeAtlas v2 download alias. The exact catalog, SQLite schema, generator, normalization, and parser revisions are recorded in release_info and manifest.json. Immutable releases remain available under their semantic version tags. ${asset_url}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" "$manifest" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Download" --notes "$notes"
          else
            gh release create "$tag" "$file" "$manifest" \
              --target "$GITHUB_SHA" \
              --title "Download" \
              --notes "$notes"
          fi
