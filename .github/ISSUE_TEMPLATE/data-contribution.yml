name: Recognition Error

description: Report an anime name or release name that AnimeAtlas does not resolve correctly.
title: "Recognition: "
labels:
  - contribution
body:
  - type: input
    id: name_that_should_resolve
    attributes:
      label: Name That Should Resolve
      description: Enter the anime name exactly as it appears. Do not add an internal ID.
      placeholder: Tensei Shitara Slime Datta Ken 4th Season
    validations:
      required: true
  - type: input
    id: example_filename_or_path
    attributes:
      label: Example Filename or Path
      description: Optional real example. Automation extracts title and Season context from this value.
      placeholder: Tensei Shitara Slime Datta Ken 4th Season - 06(78).mkv
  - type: input
    id: correct_anime
    attributes:
      label: Correct Anime
      description: Bangumi subject URL or numeric subject ID.
      placeholder: https://bgm.tv/subject/515594
    validations:
      required: true
  - type: input
    id: season_part
    attributes:
      label: Season / Part
      description: Optional natural Season, Part, or Cour context. Leave blank when unknown.
      placeholder: Season 4, Part 2
  - type: input
    id: episode_mapping
    attributes:
      label: Episode Mapping
      description: Optional observed episode relationship. Examples include 06(78), 第6集/总第78集, or ep=6 sort=78.
      placeholder: 06(78)
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Optional evidence or explanation for reviewers.
